# MathBank — docker compose (M16)
#
# Tiga layanan: app (Next.js standalone) + db (PostgreSQL 18 + pgvector) +
# caddy (reverse-proxy + TLS otomatis). Jalankan: `docker compose up -d --build`.
#
# RAHASIA: salin `.env.docker.example` → `.env.docker` dan isi nilai nyata.
# Jangan commit `.env.docker`.

services:
  db:
    # PG 18 + pgvector (ekstensi `vector` sudah tersedia di image ini).
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mathbank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?wajib diisi di .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:-mathbank}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mathbank}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Tidak mengekspos port ke host (hanya jaringan internal compose).

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-mathbank}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mathbank}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?wajib diisi di .env.docker}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost}
      SETTINGS_ENC_KEY: ${SETTINGS_ENC_KEY:?wajib diisi di .env.docker}
      AUTH_DEV_BYPASS: "false"
      APP_HTTPS: ${APP_HTTPS:-false}
      ALLOWED_DEV_ORIGINS: ${ALLOWED_DEV_ORIGINS:-}
      MEDIA_STORAGE_PATH: /app/storage/media
      BGE_M3_SERVICE_URL: ${BGE_M3_SERVICE_URL:-}
      BGE_M3_MODEL: ${BGE_M3_MODEL:-bge-m3}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - media_data:/app/storage/media
    # Tidak mengekspos port; Caddy yang meneruskan ke app:3000.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  media_data:
  caddy_data:
  caddy_config:
